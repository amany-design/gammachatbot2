<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سحر جاما: صمّم عرضك التقديمي بالذكاء الاصطناعي</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: #eef1f9;
    color: #1f2937;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    height: 100dvh;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(0,0,0,.08);
  }
  header {
    background: linear-gradient(135deg, #6d28d9, #2563eb);
    color: #fff;
    padding: 14px 18px;
  }
  header h1 { margin: 0; font-size: 19px; line-height: 1.5; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .9; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8f9fd;
  }
  .msg {
    max-width: 94%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.9;
    font-size: 16px;
  }
  .bot  { background: #fff; border: 1px solid #e5e7eb; align-self: flex-start; border-top-right-radius: 4px; }
  .user { background: #6d28d9; color: #fff; align-self: flex-end; border-top-left-radius: 4px; }

  .msg .h {
    font-weight: bold;
    color: #5b21b6;
    margin: 6px 0 4px;
    font-size: 16.5px;
  }
  .msg p { margin: 4px 0; }
  .msg ul, .msg ol { margin: 4px 0; padding-right: 22px; padding-left: 0; }
  .msg li { margin: 4px 0; }
  .msg li ul { list-style: circle; margin: 2px 0; }
  .msg li strong { color: #1d4ed8; }
  .msg img { max-width: 100%; border-radius: 10px; margin: 8px 0; border: 1px solid #e5e7eb; }
  .msg a { color: #1d4ed8; font-weight: bold; }

  .video-box { margin: 10px 0 4px; }
  .video-title { font-size: 14px; color: #6b7280; margin-bottom: 4px; }
  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-open { display: inline-block; margin-top: 4px; font-size: 14px; }

  #panel {
    border-top: 1px solid #e5e7eb;
    padding: 10px 14px 12px;
    background: #fff;
    max-height: 46vh;
    overflow-y: auto;
  }
  #panelTitle { font-size: 14px; color: #6b7280; margin: 0 0 8px; }
  .btn {
    display: block;
    width: 100%;
    text-align: right;
    margin-bottom: 8px;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    background: #f5f3ff;
    color: #5b21b6;
    border: 1.5px solid #ddd6fe;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn:hover, .btn:active { background: #ede9fe; }
  .btn.q { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .btn.q:hover, .btn.q:active { background: #dbeafe; }
  .tools { display: flex; gap: 14px; margin-top: 2px; }
  .link-btn {
    background: none; border: none; padding: 4px 0;
    color: #6b7280; font-family: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer;
  }

  .tts-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: #ede9fe; color: #5b21b6; border: 1.5px solid #ddd6fe;
    border-radius: 999px; padding: 5px 14px; margin-bottom: 6px;
    font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .tts-btn:hover { background: #ddd6fe; }
  .tts-btn.playing { background: #dc2626; color: #fff; border-color: #dc2626; }
  .tts-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e5e7eb;
    font-size: 14px; color: #4b5563;
  }
  .tts-bar select {
    font-family: inherit; font-size: 14px; padding: 3px 6px;
    border: 1px solid #ddd6fe; border-radius: 8px; background: #fff;
  }
  .tts-bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #ttsNote { font-size: 12.5px; color: #b45309; margin-top: 4px; display: none; }

  #gate {
    position: fixed; inset: 0;
    background: rgba(31, 41, 55, .88);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 10;
  }
  #gate .box {
    background: #fff; border-radius: 16px; padding: 26px 22px;
    width: 100%; max-width: 380px; text-align: center;
  }
  #gate h2 { margin: 0 0 6px; font-size: 21px; color: #5b21b6; }
  #gate .sub { margin: 0 0 14px; color: #6b7280; font-size: 14px; }
  #gate .ask { margin: 0 0 12px; font-size: 18px; font-weight: bold; }
  #gate input {
    width: 100%; padding: 12px; font-size: 17px; font-family: inherit;
    border: 1.5px solid #ddd6fe; border-radius: 10px; text-align: center; margin-bottom: 10px;
  }
  #gate .err { color: #dc2626; font-size: 14px; min-height: 20px; margin-bottom: 8px; }
  #gate button {
    width: 100%; padding: 12px; font-size: 17px; font-family: inherit;
    background: #6d28d9; color: #fff; border: none; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>✨ أهلًا بك</h2>
    <p class="sub" id="gateTitle"></p>
    <p class="ask">اكتب اسمك ثلاثي علشان تبدأ</p>
    <input id="nameInput" type="text" maxlength="80" placeholder="الاسم الثلاثي" autocomplete="name">
    <div class="err" id="nameErr"></div>
    <button id="nameBtn">ابدأ</button>
  </div>
</div>

<div class="app">
  <header>
    <h1 id="title"></h1>
    <p>اختر القسم، ثم اختر السؤال، وهتظهر لك الإجابة والشرح بالفيديو 🎬</p>
  </header>
  <div id="chat"></div>
  <div id="panel">
    <p id="panelTitle"></p>
    <div id="buttons"></div>
    <div class="tools">
      <button class="link-btn" id="backBtn" style="display:none">⬅ الرجوع للأقسام</button>
      <button class="link-btn" id="resetBtn">مسح المحادثة</button>
    </div>
    <div class="tts-bar">
      <span>🔊 الصوت:</span>
      <label>السرعة
        <select id="ttsRate">
          <option value="0.8">بطيئة</option>
          <option value="0.92" selected>عادية</option>
          <option value="1.05">سريعة</option>
        </select>
      </label>
      <label>الصوت
        <select id="ttsGender">
          <option value="female" selected>أنثى</option>
          <option value="male">ذكر</option>
        </select>
      </label>
      <label><input type="checkbox" id="ttsAuto"> قراءة تلقائية للإجابات</label>
    </div>
    <div id="ttsNote"></div>
  </div>
</div>

   الإعدادات

/* ============================================================
   من هنا لتحت لا تغيّري شيئًا
   ============================================================ */
const chat = document.getElementById("chat");
const buttons = document.getElementById("buttons");
const panelTitle = document.getElementById("panelTitle");
const backBtn = document.getElementById("backBtn");
let studentName = "";

document.getElementById("title").textContent = TITLE;
document.title = TITLE;
document.getElementById("gateTitle").textContent = TITLE;

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function ytId(v) {
  const m = String(v).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)?([\w-]{11})(?:[?&].*)?$/);
  return m ? m[1] : v;
}

function renderList(items, ordered) {
  const list = document.createElement(ordered ? "ol" : "ul");
  items.forEach(function (it) {
    const li = document.createElement("li");
    if (typeof it === "string") {
      li.textContent = it;
    } else {
      const b = document.createElement("strong");
      b.textContent = it.t;
      li.appendChild(b);
      if (it.sub) li.appendChild(renderList(it.sub, false));
    }
    list.appendChild(li);
  });
  return list;
}

function renderBlock(block, parent) {
  if (block.h) {
    const d = document.createElement("div"); d.className = "h"; d.textContent = block.h; parent.appendChild(d);
  }
  if (block.p) {
    const p = document.createElement("p"); p.textContent = block.p; parent.appendChild(p);
  }
  if (block.list) parent.appendChild(renderList(block.list, block.ordered));
  if (block.img) {
    const im = document.createElement("img"); im.src = block.img; im.alt = block.alt || ""; im.loading = "lazy"; parent.appendChild(im);
  }
  if (block.link) {
    const a = document.createElement("a");
    a.href = block.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "🔗 " + (block.t || block.link);
    const p = document.createElement("p"); p.appendChild(a); parent.appendChild(p);
  }
  if (block.video) {
    const id = ytId(block.video);
    const box = document.createElement("div"); box.className = "video-box";
    if (block.title) {
      const t = document.createElement("div"); t.className = "video-title"; t.textContent = block.title; box.appendChild(t);
    }
    const wrap = document.createElement("div"); wrap.className = "video-wrap";
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id;
    f.title = block.title || "فيديو";
    f.allowFullscreen = true;
    f.setAttribute("allow", "accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen");
    f.setAttribute("loading", "lazy");
    wrap.appendChild(f); box.appendChild(wrap);
    const open = document.createElement("a");
    open.className = "video-open"; open.href = "https://www.youtube.com/watch?v=" + id;
    open.target = "_blank"; open.rel = "noopener noreferrer";
    open.textContent = "فتح الفيديو في صفحة جديدة";
    box.appendChild(open);
    parent.appendChild(box);
  }
}

function addMessage(content, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "bot") div.appendChild(makeTtsButton(div));
  if (typeof content === "string") {
    div.textContent = content;
    div.style.whiteSpace = "pre-wrap";
  } else {
    content.forEach(function (b) { renderBlock(b, div); });
  }
  chat.appendChild(div);
  scrollDown();
  if (who === "bot" && autoRead() && div.dataset.noauto !== "1") speakMessage(div);
  return div;
}

function clearButtons() { buttons.innerHTML = ""; }

function showSections() {
  clearButtons();
  panelTitle.textContent = "اختر القسم:";
  backBtn.style.display = "none";
  SECTIONS.forEach(function (s) {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = s.icon + "  " + s.title;
    b.onclick = function () {
      addMessage(s.icon + " " + s.title, "user");
      setTimeout(function () {
        addMessage("تمام! اختر السؤال اللي عايز تعرف إجابته 👇", "bot");
        showQuestions(s);
      }, 250);
    };
    buttons.appendChild(b);
  });
  panel_scroll();
}

function showQuestions(section) {
  clearButtons();
  panelTitle.textContent = section.icon + " " + section.title;
  backBtn.style.display = "inline";
  section.questions.forEach(function (item) {
    const b = document.createElement("button");
    b.className = "btn q";
    b.textContent = item.q;
    b.onclick = function () {
      addMessage(item.q, "user");
      setTimeout(function () { addMessage(item.a, "bot"); }, 300);
    };
    buttons.appendChild(b);
  });
  panel_scroll();
}

function panel_scroll() { document.getElementById("panel").scrollTop = 0; }

function showWelcome() {
  chat.innerHTML = "";
  addMessage((studentName ? "أهلًا يا " + studentName + " 👋\n" : "أهلًا بك 👋\n") + WELCOME, "bot");
  showSections();
}

function sendName(name) {
  if (!SCRIPT_URL) return;
  try {
    fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: new URLSearchParams({ name: name }) });
  } catch (e) {}
}

function startApp() {
  if (!ASK_NAME) { showWelcome(); return; }
  let saved = "";
  try { saved = localStorage.getItem("studentName") || ""; } catch (e) {}
  if (saved) { studentName = saved; showWelcome(); return; }

  const gate = document.getElementById("gate");
  const input = document.getElementById("nameInput");
  const err = document.getElementById("nameErr");
  gate.style.display = "flex";

  function submit() {
    const n = input.value.trim().replace(/\s+/g, " ");
    if (n.split(" ").length < 3) { err.textContent = "من فضلك اكتب الاسم الثلاثي (ثلاث كلمات)"; return; }
    studentName = n;
    try { localStorage.setItem("studentName", n); } catch (e) {}
    sendName(n);
    gate.style.display = "none";
    showWelcome();
  }
  document.getElementById("nameBtn").onclick = submit;
  input.onkeydown = function (ev) { if (ev.key === "Enter") submit(); };
  input.focus();
}

/* ============================================================
   القراءة الصوتية (Text-to-Speech)
   - تقسيم النص إلى جمل قصيرة بوقفات طبيعية
   - كل مقطع عربي يُقرأ بصوت عربي، وكل كلمة إنجليزية بصوت إنجليزي
   - اختيار أفضل صوت "طبيعي" متاح على جهاز الطالب تلقائيًا
   ============================================================ */
const synth = window.speechSynthesis;
let voices = [];
let speakToken = 0;
let activeBtn = null;

function loadVoices() { if (synth) voices = synth.getVoices() || []; }
if (synth) {
  loadVoices();
  if (synth.addEventListener) synth.addEventListener("voiceschanged", loadVoices);
  else synth.onvoiceschanged = loadVoices;
}

const FEMALE_HINTS = /hoda|salma|zariyah|laila|amina|fatima|mariam|noura|female|aria|jenny|samantha|zira|susan|jessa|emma|ava|sara|google/i;
const MALE_HINTS   = /shakir|hamed|majed|maged|tarik|naayf|bassel|male|guy|davis|david|mark|daniel|alex|fred|ryan|eric/i;

function scoreVoice(v, lang, gender, preferRegion) {
  const name = v.name || "";
  const vl = (v.lang || "").replace("_", "-").toLowerCase();
  if (!vl.startsWith(lang)) return -1;
  let s = 0;
  if (/natural|neural/i.test(name)) s += 40;
  if (/online/i.test(name)) s += 25;
  if (/google/i.test(name)) s += 15;
  if (/premium|enhanced/i.test(name)) s += 12;
  if (vl === preferRegion) s += 8;
  if (/espeak|compact/i.test(name)) s -= 30;
  if (/microsoft/i.test(name) && !/online|natural/i.test(name)) s -= 6;
  if (gender === "male") {
    if (MALE_HINTS.test(name) && !/female/i.test(name)) s += 10;
  } else {
    if (FEMALE_HINTS.test(name)) s += 10;
  }
  return s;
}

function pickVoice(lang, gender) {
  const region = lang === "ar" ? "ar-eg" : "en-us";
  let best = null, bestScore = -1;
  voices.forEach(function (v) {
    const sc = scoreVoice(v, lang, gender, region);
    if (sc > bestScore) { bestScore = sc; best = v; }
  });
  return best;
}

/* تصحيح نطق بعض الكلمات والرموز */
const EN_FIX = [
  [/\bEsc\b/g, "Escape"],
  [/\bGmail\b/g, "Gee mail"],
  [/\bGamma\b/gi, "Gamma"],
  [/\bPDF\b/g, "P D F"],
  [/\bNLP\b/g, "N L P"],
  [/\bAI\b/g, "A I"],
  [/\bUI\b/g, "U I"],
  [/\bGoogle Slides\b/gi, "Google Slides"]
];
function fixEnglish(t) { EN_FIX.forEach(function (r) { t = t.replace(r[0], r[1]); }); return t; }

function cleanArabic(t) {
  return t
    .replace(/\+/g, " زائد ")
    .replace(/[«»"“”()\[\]{}]/g, " ")
    .replace(/[⋯…•→←⬅🔗]/g, " ")
    .replace(/(\d+)\)/g, "$1 ")
    .replace(/\s+/g, " ")
    .trim();
}

/* استخراج النص المقروء من رسالة */
function messageText(div) {
  const clone = div.cloneNode(true);
  clone.querySelectorAll(".tts-btn, .video-open, iframe, img").forEach(function (n) { n.remove(); });
  clone.querySelectorAll("li, p, .h, .video-title, ul, ol").forEach(function (n) { n.appendChild(document.createTextNode("\n")); });
  let txt = clone.textContent || "";
  /* إزالة الإيموجي */
  txt = txt.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, " ");
  return txt;
}

/* تقسيم إلى أجزاء (عربي / إنجليزي) */
const LATIN_RUN = /([A-Za-z][A-Za-z0-9.'’\-\/&]*(?:\s+[A-Za-z0-9][A-Za-z0-9.'’\-\/&]*)*)/;

function buildChunks(text) {
  const chunks = [];
  text.split(/\n+/).forEach(function (line) {
    line = line.trim();
    if (!line) return;
    /* جمل قصيرة عند علامات الوقف */
    line.replace(/([.!؟?؛:،])\s+/g, "$1\u0001").split("\u0001").forEach(function (sentence) {
      sentence.split(LATIN_RUN).forEach(function (part) {
        if (!part || !part.trim()) return;
        const isEn = /^[A-Za-z]/.test(part.trim());
        if (isEn) {
          chunks.push({ lang: "en", text: fixEnglish(part.trim()) });
        } else {
          const c = cleanArabic(part);
          if (/[\u0600-\u06FF0-9]/.test(c)) chunks.push({ lang: "ar", text: c });
        }
      });
      /* وقفة بسيطة بعد كل جملة */
      if (chunks.length) chunks[chunks.length - 1].pause = true;
    });
    if (chunks.length) chunks[chunks.length - 1].longPause = true;
  });
  return chunks;
}

function stopSpeaking() {
  speakToken++;
  if (synth) synth.cancel();
  if (activeBtn) {
    activeBtn.classList.remove("playing");
    activeBtn.textContent = "🔊 استمع";
    activeBtn = null;
  }
}

function speakMessage(div) {
  if (!synth) return;
  const btn = div.querySelector(".tts-btn");
  stopSpeaking();
  loadVoices();
  const chunks = buildChunks(messageText(div));
  if (!chunks.length) return;

  const myToken = speakToken;
  const rate = parseFloat(document.getElementById("ttsRate").value) || 0.92;
  const gender = document.getElementById("ttsGender").value;
  const arVoice = pickVoice("ar", gender);
  const enVoice = pickVoice("en", gender);

  const note = document.getElementById("ttsNote");
  if (!arVoice) {
    note.style.display = "block";
    note.textContent = "⚠ جهازك لا يحتوي على صوت عربي. لأفضل صوت طبيعي استخدم متصفح Microsoft Edge أو Chrome على أندرويد.";
  } else {
    note.style.display = "none";
  }

  if (btn) { btn.classList.add("playing"); btn.textContent = "⏹ إيقاف"; activeBtn = btn; }

  let i = 0;
  function next() {
    if (myToken !== speakToken) return;
    if (i >= chunks.length) { stopSpeaking(); return; }
    const c = chunks[i++];
    const u = new SpeechSynthesisUtterance(c.text);
    const v = c.lang === "ar" ? arVoice : enVoice;
    if (v) { u.voice = v; u.lang = v.lang; }
    else u.lang = c.lang === "ar" ? "ar-EG" : "en-US";
    u.rate = c.lang === "en" ? Math.min(rate, 0.95) : rate;
    u.pitch = 1;
    u.volume = 1;
    const gap = c.longPause ? 380 : (c.pause ? 220 : 40);
    u.onend = function () { setTimeout(next, gap); };
    u.onerror = function () { setTimeout(next, 0); };
    synth.speak(u);
  }
  next();
}

function makeTtsButton(div) {
  const b = document.createElement("button");
  b.className = "tts-btn";
  b.type = "button";
  b.textContent = "🔊 استمع";
  if (!synth) { b.style.display = "none"; return b; }
  b.onclick = function () {
    if (b.classList.contains("playing")) stopSpeaking();
    else speakMessage(div);
  };
  return b;
}

function autoRead() {
  const c = document.getElementById("ttsAuto");
  return !!(c && c.checked && synth);
}

/* الرسالة الترحيبية لا تُقرأ تلقائيًا قبل تفاعل الطالب */
const _showWelcome = showWelcome;
showWelcome = function () {
  stopSpeaking();
  const auto = document.getElementById("ttsAuto");
  const was = auto.checked;
  auto.checked = false;
  _showWelcome();
  auto.checked = was;
};

window.addEventListener("beforeunload", function () { if (synth) synth.cancel(); });

backBtn.onclick = function () { showSections(); };
document.getElementById("resetBtn").onclick = showWelcome;
startApp();
</script>
